name: Compila LaTeX e Pubblica PDF

on:
  push:
    branches: ["main"] # Cambia in 'master' se il tuo ramo principale si chiama così
  workflow_dispatch:   # Ti permette di avviare la compilazione anche manualmente da interfaccia web

# Permessi di sicurezza necessari per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita che deploy simultanei si sovrappongano
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice repository
        uses: actions/checkout@v4

      - name: Compila il file LaTeX in PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex # Se il tuo file ha un nome diverso, modificalo qui
          # args: -pdf -file-line-error -interaction=nonstopmode

      - name: Prepara i file per il sito web
        run: |
          mkdir -p public
          cp main.pdf public/
          if [ -f index.html ]; then cp index.html public/; fi

      - name: Carica l'artefatto di build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4