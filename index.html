<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VisAi — Analisi dei Requisiti Tecnici</title>
    <style>
        :root {
            --primary: #1A73E8;
            --primary-hover: #1557b0;
            --bg: #f6f8fa;
            --text: #24292e;
            --text-secondary: #5F6368;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 10px;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
        }
        h1 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 26px;
            line-height: 1.3;
        }
        p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        /* Contenitore flessibile per i pulsanti */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            min-height: 48px; /* Area di tocco ottimizzata per i pollici */
            box-shadow: 0 2px 4px rgba(26, 115, 232, 0.2);
        }
        .btn:hover, .btn:active {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #f1f3f4;
            color: var(--primary);
            box-shadow: none;
        }
        .btn-secondary:hover, .btn-secondary:active {
            background-color: #e8eaed;
        }
        /* Contenitore reattivo per il PDF */
        .pdf-wrapper {
            position: relative;
            width: 100%;
            height: 82vh;
            min-height: 500px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            overflow: hidden;
            background-color: #525659;
        }
        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* =========================================================
           OTTIMIZZAZIONI SPECIFICHE PER SMARTPHONE (Schermi < 600px)
           ========================================================= */
        @media (max-width: 600px) {
            body {
                padding: 10px 6px;
            }
            .container {
                padding: 20px 15px;
                border-radius: 10px;
            }
            h1 {
                font-size: 22px;
            }
            p {
                font-size: 14px;
                margin-bottom: 20px;
            }
            /* Su mobile i pulsanti si impilano verticalmente e occupano il 100% della larghezza */
            .button-group {
                flex-direction: column;
                gap: 10px;
            }
            .btn {
                width: 100%;
                font-size: 16px; /* Evita lo zoom automatico al tocco su iOS Safari */
            }
            .pdf-wrapper {
                height: 65vh; /* Altezza ridotta per lasciare spazio di scorrimento alla pagina */
                min-height: 380px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VisAi — Analisi dei Requisiti Tecnici</h1>
        <p>Il documento viene rigenerato automaticamente ad ogni aggiornamento del codice sorgente su GitHub.</p>
        
        <div class="button-group">
            <!-- Pulsante prioritario per il mobile: apre il PDF a schermo intero nel visualizzatore nativo -->
            <a href="analisi-requisiti-tecnici.pdf" class="btn" target="_blank" rel="noopener">Apri a tutto schermo</a>
            <!-- Pulsante secondario di download diretto -->
            <a href="analisi-requisiti-tecnici.pdf" class="btn btn-secondary" download>Scarica il PDF</a>
        </div>
        
        <div class="pdf-wrapper">
            <iframe class="pdf-viewer" src="analisi-requisiti-tecnici.pdf">
                <p>Il tuo browser non supporta l'anteprima integrata.</p>
                <p><a href="analisi-requisiti-tecnici.pdf">Clicca qui per scaricare il documento.</a></p>
            </iframe>
        </div>
    </div>
</body>
</html>
